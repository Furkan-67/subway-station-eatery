name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp build/outputs/apk/debug/*.apk SubwayStationEatery.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubwayStationEatery-apk
          path: SubwayStationEatery.apk

      - name: Publish APK to Releases (for phone download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest APK
          files: SubwayStationEatery.apk
          make_latest: true
